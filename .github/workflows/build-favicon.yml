name: Build cropped favicon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-favicon.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pillow
      - name: Crop favicon artwork
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("assets/logo/tang-lab-favicon.png").convert("RGBA")
          # Trim only outer background so the approved tiger artwork occupies more of the browser favicon.
          crop = src.crop((126, 117, 1126, 1117))
          crop = crop.resize((512, 512), Image.Resampling.LANCZOS)
          crop.save("assets/logo/tang-lab-favicon-large.png", optimize=True)
          PY
      - name: Commit cropped favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo/tang-lab-favicon-large.png
          git commit -m "Add tighter favicon crop" || exit 0
          git push
